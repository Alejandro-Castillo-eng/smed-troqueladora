name: Publicar aplicación en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verificar backend local
        run: python3 -m unittest test_backend -q
      - name: Preparar versión de revisión
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
